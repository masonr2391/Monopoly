<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monopoly Online — Multiplayer Board Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <style>
    :root {
      --bg-app: #090d16;
      --bg-panel: #101726;
      --bg-card: #162033;
      --bg-card-hover: #1c2840;
      --bg-input: #0c1220;
      --border: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(148, 163, 184, 0.28);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --emerald: #10b981;
      --emerald-dark: #059669;
      --gold: #f59e0b;
      --gold-soft: rgba(245, 158, 11, 0.14);
      --sky: #38bdf8;
      --rose: #f43f5e;
      --violet: #a78bfa;

      --set-brown: #8b4513;
      --set-lightblue: #38bdf8;
      --set-pink: #ec4899;
      --set-orange: #f97316;
      --set-red: #ef4444;
      --set-yellow: #eab308;
      --set-green: #22c55e;
      --set-darkblue: #3b82f6;
      --set-railroad: #64748b;
      --set-utility: #14b8a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(16, 185, 129, 0.09), transparent 40%),
        radial-gradient(circle at 85% 8%, rgba(56, 189, 248, 0.08), transparent 42%),
        var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    .hidden {
      display: none !important;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
      border-color: rgba(16, 185, 129, 0.5);
      color: #03150e;
      font-weight: 700;
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #34d399, var(--emerald));
    }

    .btn-gold {
      background: linear-gradient(135deg, #fbbf24, #d97706);
      border-color: rgba(251, 191, 36, 0.5);
      color: #1c1102;
      font-weight: 700;
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.14);
      border-color: rgba(244, 63, 94, 0.35);
      color: #fda4af;
    }

    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text-muted);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--emerald);
    }

    /* Top Header */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      background: rgba(16, 23, 38, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .
